name: Build Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller pillow

      - name: Run automated tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          RUN_QT_WIDGET_TESTS: "1"
        run: python -m unittest discover -s tests -p "*test.py"

      - name: Build portable application
        shell: pwsh
        run: python -m PyInstaller build/offline_anonymizer_windows.spec --noconfirm --clean

      - name: Run packaged self-check
        shell: pwsh
        run: '& ".\dist\ReaL Redacter\ReaL Redacter.exe" --self-check'

      - name: Create portable ZIP and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path ".\dist\ReaL Redacter" -DestinationPath ".\release\ReaL Redacter-2.2.3-windows-x64.zip" -CompressionLevel Optimal -Force
          Get-FileHash ".\release\ReaL Redacter-2.2.3-windows-x64.zip" -Algorithm SHA256 | Format-List

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ReaL-Redacter-2.2.3-windows-x64
          path: release/ReaL Redacter-2.2.3-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
